[pytest]
minversion = 7.0
testpaths = backend/tests
pythonpath = . backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
markers =
    asyncio: mark test as async
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
