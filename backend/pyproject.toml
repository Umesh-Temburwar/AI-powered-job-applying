[project]
name = "universal-job-apply-bot-backend"
version = "0.1.0"
description = "FastAPI Backend for Universal Job Apply Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "supabase>=2.0.0,<3.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.11.0",
    "html5lib>=1.1",
    "lxml>=4.9.0",
    "selenium>=4.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
